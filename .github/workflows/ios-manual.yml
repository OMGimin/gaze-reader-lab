name: iOS manual validation
# Explicitly manual: does not spend macOS runner minutes on every push.
on:
  workflow_dispatch:
jobs:
  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and run pure logic tests (no camera test)
        run: xcodebuild test -project ios/GazeReader.xcodeproj -scheme GazeReader -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO
