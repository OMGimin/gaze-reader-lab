name: GazeReader
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '0.2.0'
targets:
  GazeReader:
    type: application
    platform: iOS
    sources:
      - GazeReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GazeReader
        INFOPLIST_FILE: GazeReader/Info.plist
    scheme:
      testTargets:
        - GazeReaderTests
  GazeReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GazeReaderTests
    dependencies:
      - target: GazeReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
