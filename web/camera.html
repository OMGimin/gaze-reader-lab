<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaze Camera — 로컬 카메라</title><link rel="stylesheet" href="camera.css"></head><body><main><div class="eyebrow">GAZE / CAMERA</div><h1>카메라는 직접<br>시작하세요.</h1><p>영상은 이 창의 메모리에서 처리됩니다.<br>녹화·저장·외부 전송을 하지 않습니다.</p><video autoplay playsinline muted aria-label="카메라 미리보기"></video><p id="camera-status" role="status">카메라 꺼짐</p><div class="buttons"><button id="start-camera">카메라 켜기</button><button id="stop-camera">카메라 끄기</button></div><button id="check-model" class="secondary">모델만 점검 (카메라 안 켬)</button><p class="note">시작 후 읽기 창으로 돌아가 ‘시선 보정’을 누르세요. 이 창은 보이는 위치에 두세요. 최소화·가림·절전으로 입력이 느려지면 스크롤이 정지합니다.</p></main><script src="camera.js" type="module"></script></body></html>
